name: Idea or improvement
description: Suggest a focused improvement, section, interaction, or future enhancement.
title: "Idea: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Small, thoughtful improvements are very welcome.

  - type: checkboxes
    id: checks
    attributes:
      label: Quick checks
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: This idea is related to the portfolio or its documentation.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What would this improve?
      placeholder: The portfolio could make the resume download easier to find.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: Idea
      placeholder: Add a compact sticky contact card with LinkedIn, GitHub, email, and resume download.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Content
        - UI or visual design
        - UX or interaction
        - Accessibility
        - Performance
        - SEO
        - Documentation
        - Tooling or CI
        - Nice to have
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Extra context
      description: Add references, mockups, examples, or tradeoffs if useful.
